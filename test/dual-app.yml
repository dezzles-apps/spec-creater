name: nginx-example
environments:
  - dev
  - prod
audiences:
  - audience1
  - audience2
primary:
  name: nginx
  image: nginx
  port: 8080
  secrets:
    - envName: UI_PASSWORD
      secretName: alltheskins-ui
  env:
    - envName: UI_URL
      value: my-ui
    - envName: NUMERIC_VALUE
      value: 123
    - envName: NUMERIC_STRING_VALUE
      value: '1234'
sidecars:
  - name: hello
    image: us-docker.pkg.dev/cloudrun/container/hello
    port: 8888
    secrets:
      - envName: DATASOURCE_PASSWORD
        secretName: alltheskins-non
    env:
      - envName: DATASOURCE_URL
        value: my-datasource
      - envName: NUMERIC_VALUE2
        value: 456
      - envName: NUMERIC_STRING_VALUE2
        value: '4567'
