apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nginx-example-uat
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    spec:
      containers:
      - 
        name: nginx
        image: nginx:1.0.2
        ports:
        - containerPort: 8080
          name: http1
        env:
          - name: ENVIRONMENT
            value: uat
          - name: SPRING_PROFILES_ACTIVE
            value: uat
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 240
      - 
        name: hello
        image: us-docker.pkg.dev/cloudrun/container/hello:1.0.2
        env:
          - name: ENVIRONMENT
            value: uat
          - name: SPRING_PROFILES_ACTIVE
            value: uat
          - name: PORT
            value: '8888'
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
      timeoutSeconds: 300